name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: runcycles/.github/.github/workflows/ci-python.yml@main
    with:
      mypy-target: langchain_runcycles
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
