[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-runcycles"
version = "0.1.0"
description = "LangChain agent middleware for Cycles — pre-tool-call authorization, fan-out caps, and per-tenant budget enforcement for Python agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    # Category-search keywords
    "ai-agent",
    "agent-middleware",
    "agent-budget",
    "agent-governance",
    "budget-control",
    "cost-control",
    "spending-limit",
    "tool-authorization",
    "pre-tool-call-authorization",
    "multi-tenant",
    "runtime-authority",
    # Framework targeting
    "langchain",
    "langgraph",
    "langchain-middleware",
    # Brand
    "cycles",
    "runcycles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "runcycles>=0.4.1",
    "langchain>=1.0,<2.0",
    "langchain-core>=0.3",
]

[project.urls]
Homepage = "https://runcycles.io"
Documentation = "https://runcycles.io/integrations/langchain"
Repository = "https://github.com/runcycles/langchain-runcycles"
Changelog = "https://github.com/runcycles/langchain-runcycles/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/runcycles/langchain-runcycles/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["runcycles", "runcycles.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["langchain_runcycles"]

[tool.coverage.report]
fail_under = 95
