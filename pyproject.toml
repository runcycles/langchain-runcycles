[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-runcycles"
version = "0.2.0"
description = "LangChain agent middleware for Cycles — pre-execution budget authority for model calls, tool calls, and runaway agent loops in Python create_agent workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    # Category-search keywords (aligned with cycles-client-python's SEO refresh)
    "ai-agent",
    "agent-middleware",
    "agent-budget",
    "agent-governance",
    "agent-safety",
    "budget-control",
    "cost-control",
    "spending-limit",
    "llm-cost",
    "llmops",
    "runtime-authority",
    "action-control",
    "multi-tenant",
    # LangChain ecosystem (the differentiator vs the parent SDK)
    "langchain",
    "langgraph",
    "langchain-middleware",
    "tool-authorization",
    "pre-tool-call-authorization",
    "mcp",
    # Brand
    "cycles",
    "runcycles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "runcycles>=0.4.1",
    "langchain>=1.0,<2.0",
    # Tightened from `>=0.3` per external review — langchain 1.x always pulls
    # langchain-core 1.x transitively; pinning this explicitly avoids a stale
    # 0.x landing accidentally in mixed environments.
    "langchain-core>=1.0,<2.0",
]

[project.urls]
Homepage = "https://runcycles.io"
Documentation = "https://github.com/runcycles/langchain-runcycles#readme"
Repository = "https://github.com/runcycles/langchain-runcycles"
Changelog = "https://github.com/runcycles/langchain-runcycles/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/runcycles/langchain-runcycles/issues"

[project.optional-dependencies]
# Slimmer than cycles-client-python's dev deps: this package mocks the runcycles
# SDK boundary directly (no httpx/respx, no protocol-spec validation needed).
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["runcycles", "runcycles.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["langchain_runcycles"]

[tool.coverage.report]
fail_under = 95
